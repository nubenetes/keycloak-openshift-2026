# OAuth2-Proxy Configuration for Backend-For-Frontend (BFF) Pattern
# Provides confidential session handling and converts HttpOnly cookies to Bearer JWTs

http_address = "0.0.0.0:4180"
upstreams = [
    "http://enterprise-angular-spa:80/",
    "http://microservices-gateway:8080/api/"
]

# Provider Configuration (Red Hat Build of Keycloak)
provider = "keycloak-oidc"
client_id = "angular-spa"
client_secret = "CHANGE_ME_BFF_CLIENT_SECRET"
oidc_issuer_url = "https://sso.enterprise.example.com/realms/enterprise"
redirect_url = "https://portal.apps.cluster-charlie.aws.enterprise.com/oauth2/callback"

# Security & Cookie Attributes
cookie_name = "_enterprise_session"
cookie_secret = "CHANGE_ME_32_BYTE_SECRET_KEY_123456"
cookie_secure = true
cookie_httponly = true
cookie_samesite = "strict"
cookie_expire = "10h"
cookie_refresh = "15m"

# Header Injection for Downstream Resource Servers
pass_access_token = true
pass_authorization_header = true
set_xauthrequest = true
pass_user_headers = true

# Allowed Email Domains & Groups
email_domains = ["*"]
allowed_groups = ["/Developers", "/Admins", "/Platform-Engineers"]
