# Quarkus OpenID Connect Resource Server Configuration
quarkus.http.port=8081
quarkus.application.name=quarkus-api-service

# OIDC Discovery & Validation
quarkus.oidc.auth-server-url=https://sso.enterprise.example.com/realms/enterprise
quarkus.oidc.client-id=quarkus-api-service
quarkus.oidc.credentials.secret=CHANGE_ME_QUARKUS_CLIENT_SECRET
quarkus.oidc.application-type=service
quarkus.oidc.token.issuer=https://sso.enterprise.example.com/realms/enterprise

# SmallRye JWT Claim & Role Mappings
quarkus.smallrye-jwt.roles-map.realm_access.roles=groups
mp.jwt.verify.publickey.location=https://sso.enterprise.example.com/realms/enterprise/protocol/openid-connect/certs

# Downstream Microservice Target for Token Exchange
downstream.service.url=https://payment-service.keycloak.svc.cluster.local:8082
