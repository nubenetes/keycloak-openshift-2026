version: '3.8'

services:
  # 1. Local PostgreSQL 16
  postgres:
    image: postgres:16-alpine
    container_name: local-keycloak-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloakpassword
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Local OpenLDAP (Simulating Corporate Active Directory)
  openldap:
    image: osixia/openldap:1.5.0
    container_name: local-active-directory
    environment:
      LDAP_ORGANISATION: "Enterprise Corp"
      LDAP_DOMAIN: "enterprise.corp"
      LDAP_ADMIN_PASSWORD: "AdminPassword123!"
    ports:
      - "389:389"
      - "636:636"
    volumes:
      - ./mock-ad-ldap/users.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/50-users.ldif:ro

  # 3. Local Keycloak 24/26 (Quarkus Engine)
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: local-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloakpassword
      KC_FEATURES: token-exchange,preview
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
    ports:
      - "8080:8080"
      - "9000:9000"
    volumes:
      - ../gitops/base/realms/enterprise-realm-import.yaml:/opt/keycloak/data/import/enterprise-realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      openldap:
        condition: service_started

  # 4. Node.js Edge API Gateway
  api-gateway:
    build:
      context: ../apps/microservices/nodejs-api-gateway
    container_name: local-api-gateway
    environment:
      PORT: 8085
      KEYCLOAK_URL: http://keycloak:8080
      REALM: enterprise
    ports:
      - "8085:8085"
    depends_on:
      - keycloak

  # 5. Enterprise Angular 18+ Single Page App
  angular-spa:
    build:
      context: ../apps/angular-spa
    container_name: local-angular-spa
    ports:
      - "4200:8080"
    depends_on:
      - keycloak
