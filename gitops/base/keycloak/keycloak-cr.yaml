apiVersion: k8s.keycloak.org/v2alpha1
kind: Keycloak
metadata:
  name: keycloak-enterprise
  namespace: keycloak
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: enterprise-iam
spec:
  instances: 2
  db:
    vendor: postgres
    host: keycloak-db-primary.keycloak.svc.cluster.local
    port: 5432
    database: keycloak
    usernameSecret:
      name: keycloak-db-secret
      key: username
    passwordSecret:
      name: keycloak-db-secret
      key: password
    poolMinSize: 10
    poolInitialSize: 10
    poolMaxSize: 50
  http:
    tlsSecret: keycloak-tls-secret
  hostname:
    hostname: sso.enterprise.example.com
    strict: true
    strictBackchannel: true
  features:
    enabled:
      - token-exchange
      - docker
      - scripts
      - preview
  additionalOptions:
    - name: metrics-enabled
      value: "true"
    - name: health-enabled
      value: "true"
    - name: proxy-headers
      value: "xforwarded"
    - name: cache-stack
      value: "kubernetes"
    - name: log-level
      value: "INFO,org.keycloak.events:DEBUG"
  resources:
    requests:
      cpu: "1000m"
      memory: "1536Mi"
    limits:
      cpu: "3000m"
      memory: "3072Mi"
  unsupported:
    podTemplate:
      spec:
        containers:
          - name: keycloak
            env:
              - name: JAVA_OPTS_APPEND
                value: "-XX:+UseG1GC -XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError -Djava.net.preferIPv4Stack=true -Djgroups.dns.query=keycloak-discovery.keycloak.svc.cluster.local"
            readinessProbe:
              httpGet:
                path: /health/ready
                port: 9000
                scheme: HTTPS
              initialDelaySeconds: 20
              periodSeconds: 10
              failureThreshold: 3
            livenessProbe:
              httpGet:
                path: /health/live
                port: 9000
                scheme: HTTPS
              initialDelaySeconds: 30
              periodSeconds: 15
              failureThreshold: 3
        affinity:
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  labelSelector:
                    matchExpressions:
                      - key: app
                        operator: In
                        values:
                          - keycloak
                  topologyKey: topology.kubernetes.io/zone
---
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-tls-secret
  namespace: keycloak
type: kubernetes.io/tls
stringData:
  tls.crt: |
    -----BEGIN CERTIFICATE-----
    MIIDBjCCAe4CCQD...PLACEHOLDER_OR_CERT_MANAGER_GENERATED...
    -----END CERTIFICATE-----
  tls.key: |
    -----BEGIN PRIVATE KEY-----
    MIIEvgIBADANBgk...PLACEHOLDER_OR_CERT_MANAGER_GENERATED...
    -----END PRIVATE KEY-----
